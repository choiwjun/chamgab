[pytest]
testpaths =
    ml-api/tests

# Keep pytest collection tight; this repo contains scripts and a worktree copy
# that are not intended to be imported/collected as tests.
norecursedirs =
    .git
    .next
    .npm-cache
    node_modules
    worktree
    ml-api/scripts
    ml-api/.pytest_cache
    ml-api/.tmp-pytest
    pytest-cache-files-*

# The cache provider creates temporary dirs under the repo that can fail on
# Windows with restrictive ACLs; it's not needed for CI/local correctness.
addopts = -ra -p no:cacheprovider

